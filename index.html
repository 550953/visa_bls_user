<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анкета</title>
</head>
<body>

<h3>Анкета (тест)</h3>

<p>Как тебя зовут</p>
<input type="text" id="field_name" style="width:100%;padding:8px;box-sizing:border-box;">

<br><br>
<button id="btnSave">Сохранить</button>
<button id="btnDownload">Скачать JSON</button>
<button id="btnLoad">Загрузить JSON</button>
<input type="file" id="fileInput" accept="application/json" style="display:none;">
<br><br>
<button id="btnSend">Отправить в бот</button>

<p id="status" style="color:green;"></p>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

const STORAGE_KEY = 'anketa_data';

function getData() {
  return { name: document.getElementById('field_name').value };
}

function setData(data) {
  document.getElementById('field_name').value = data.name || '';
}

function loadFromStorage() {
  // Пытаемся из Telegram CloudStorage, иначе из localStorage
  if (tg && tg.CloudStorage) {
    tg.CloudStorage.getItem(STORAGE_KEY, (err, value) => {
      if (!err && value) setData(JSON.parse(value));
    });
  } else {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) setData(JSON.parse(raw));
  }
}

function saveToStorage() {
  const data = getData();
  const json = JSON.stringify(data);
  if (tg && tg.CloudStorage) {
    tg.CloudStorage.setItem(STORAGE_KEY, json);
  } else {
    localStorage.setItem(STORAGE_KEY, json);
  }
  document.getElementById('status').textContent = 'Сохранено: ' + json;
}

document.getElementById('btnSave').onclick = saveToStorage;

document.getElementById('btnDownload').onclick = () => {
  const data = getData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'anketa.json';
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('btnLoad').onclick = () => {
  document.getElementById('fileInput').click();
};

document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      setData(data);
      document.getElementById('status').textContent = 'Загружено из файла';
    } catch (err) {
      document.getElementById('status').textContent = 'Ошибка чтения JSON';
    }
  };
  reader.readAsText(file);
};

document.getElementById('btnSend').onclick = () => {
  const data = getData();
  if (tg) {
    tg.sendData(JSON.stringify(data));
  } else {
    alert('Открыто вне Telegram, sendData недоступен. Данные: ' + JSON.stringify(data));
  }
};

loadFromStorage();
</script>

</body>
</html>
